# OpenShell sandbox policy for agent-foundry — generated by agentkit from the tool allowlist.
# tools: record_list, record_get, record_put, read_file, note_write, current_time
# approval actions (NOT pre-authorized): publish_agent, deploy_agent, launch_agent, apply_fix
# Model calls route through https://inference.local (set with `openshell inference set`); caller keys are stripped.

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /sandbox/data, /sandbox/reports, /tmp, /dev/null]
landlock:
  compatibility: best_effort

network_policies: {}   # no tool needs egress; only routed inference leaves the sandbox
