# Agent Seller — generated by Agent Foundry from commission spec (do not hand-edit while the Foundry owns it)

[agent]
name = "Agent Seller"
slug = "agent-seller"
version = "1.0.2"
description = "A sales worker that knows every agent in the Foundry catalogue, finds and qualifies the companies and people who could use one, prices it with 2026 market benchmarks, and drafts outreach and quotes that never go out without the owner's approval."
organization = "Agent Foundry"
responsibility = "Turn the catalogue into a qualified, priced, approval-gated sales pipeline: find prospects, qualify them, quote them, and draft the outreach, without ever contacting anyone on its own."
audience = "Owners of the catalogue (the Foundry's operator) and, downstream, any company or individual with repetitive work an agent can take over."

[model]
backend = "ollama"
ollama_model = "qwen3.8:27b"
ollama_url = "http://localhost:11434"
ollama_num_ctx = 16384
claude_model = "sonnet"

[limits]
max_model_calls_per_run = 70
max_tokens_per_run = 400000
max_run_minutes = 45
monthly_model_call_cap = 3000
max_steps_per_task = 16
max_tool_calls_per_task = 24
tool_output_chars = 6000

[tools]
allowed = ["catalog_lookup", "web_search", "web_fetch", "record_put", "record_get", "record_list", "quote_price", "draft_outreach", "note_write", "current_time"]

[approvals]
actions = ["send_email", "schedule_call"]

[schedule]
time = "08:00"

[paths]
inbox = "reports"
db = "data/agent.db"
ledger = "data/ledger.jsonl"

[mission_control]
host = "127.0.0.1"
port = 8111

[agent_data]
catalog_path = "../catalog.json"
built_by = "Agent Foundry"
