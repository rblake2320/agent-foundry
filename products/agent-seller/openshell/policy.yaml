# OpenShell sandbox policy for agent-seller — generated by agentkit from the tool allowlist.
# tools: catalog_lookup, web_search, web_fetch, record_put, record_get, record_list, quote_price, draft_outreach, note_write, current_time
# approval actions (NOT pre-authorized): send_email, schedule_call
#   send_email: SMTP host (from SMTP_HOST) — add a rule only when a send_email approval is executed
# Model calls route through https://inference.local (set with `openshell inference set`); caller keys are stripped.

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /sandbox/data, /sandbox/reports, /tmp, /dev/null]
landlock:
  compatibility: best_effort

network_policies:
  tool_egress:
    name: agent-seller-tool-egress
    endpoints:
      - host: html.duckduckgo.com
        port: 443
        protocol: https
        enforcement: enforce
        access: read-only
      - host: duckduckgo.com
        port: 443
        protocol: https
        enforcement: enforce
        access: read-only
      - host: lite.duckduckgo.com
        port: 443
        protocol: https
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/python3 }
